<div class="star-container">
  @for (star of [1, 2, 3, 4, 5]; track star) {
    <button
      type="button"
      [disabled]="disabled()"
      (click)="rate(star)"
      (mouseenter)="setHover(star)"
      (mouseleave)="setHover(0)"
      class="star-button"
      [class.active]="star <= (hoverState() || rating())"
      [class.disabled]="disabled()">
      ★
    </button>
  }
</div>
